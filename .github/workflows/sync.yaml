name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{secrets.HF_SECRET}}
        run: git push --force https://TeekLakshmi:$HF_SECRET@huggingface.co/spaces/TeekLakshmi/Fast-Api main